<text x="847" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#17363E" dominant-baseline="text-before-edge">SU GÜVENLİĞİ</text>
<text x="847" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#577078" dominant-baseline="text-before-edge">Miktar, kalite,</text>
