<text x="257" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" fill="#FFFFFF" dominant-baseline="text-before-edge">SUSTAINABLE PRODUCTION FRONTIER</text>
<text x="257" y="741" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="400" fill="#FFFFFF" dominant-baseline="text-before-edge">Nerede + ne + hangi yöntem + hangi su kaynağı + hangi dönem?</text>
<rect x="210" y="839" width="1500" height="104" rx="16" fill="#E3E7DD"/>
<text x="245" y="859" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#17363E" dominant-baseline="text-before-edge">PWN’nin katkısı: ilgili deniz modelini ve kaynak suyunu yerinde sınamak.</text>
<text x="245" y="902" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#577078" dominant-baseline="text-before-edge">Kaynak suyu → arıtma / kullanılabilir su → enerji → ilgili üretim kararı. Karasal su bütçesi ayrıca gerekir.</text>
<text x="92" y="1005" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#577078" dominant-baseline="text-before-edge">Yönteme özgü kısıtlar uygulanır; eksik veri “uygun” sayılmaz.  •  Kaynak: U5 / EVIDENCE_MAP E01–E06, E13, E19</text>
