[project]
name = "agrohydro"
version = "0.5.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "scipy==1.15.2",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "gsw==3.6.19",
    "pydantic==2.11.4",
    "reportlab==5.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

