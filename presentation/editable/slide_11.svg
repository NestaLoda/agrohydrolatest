<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#083C3C" stroke="none"/><rect x="96" y="61" width="46" height="5" rx="0" fill="#B9EDCA" stroke="none"/><text id="t0" x="96" y="112" font-size="24" font-weight="700" fill="#B9EDCA" text-anchor="start">AGROHYDRO</text><text id="t1" x="1824" y="112" font-size="22" font-weight="400" fill="#A2C8C1" text-anchor="end">HESAPTAN FİZİKSEL KANITA</text><text id="t2" x="96" y="219" font-size="58" font-weight="700" fill="#FFFFFF" text-anchor="start">Buraya kadar model. Peki gerçek dünya?</text><path d="M96,267 L1824,267" stroke="#2F625E" stroke-width="2" fill="none" /><text id="t3" x="96" y="350" font-size="25" font-weight="700" fill="#B9EDCA" text-anchor="start">MODEL</text><text id="t4" x="1090" y="350" font-size="25" font-weight="700" fill="#CBEAF0" text-anchor="start">SAHA</text><path d="M96,403 L810,403" stroke="#376861" stroke-width="2" fill="none" /><text id="t5" x="110" y="461" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">İklim verileri</text><path d="M96,501 L810,501" stroke="#376861" stroke-width="2" fill="none" /><text id="t6" x="110" y="559" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Literatür ve üretim katsayıları</text><path d="M96,599 L810,599" stroke="#376861" stroke-width="2" fill="none" /><text id="t7" x="110" y="657" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Açık varsayımlar</text><path d="M96,697 L810,697" stroke="#376861" stroke-width="2" fill="none" /><text id="t8" x="110" y="755" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Simülasyon</text><path d="M1090,403 L1810,403" stroke="#376861" stroke-width="2" fill="none" /><text id="t9" x="1104" y="461" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Gerçek su profili</text><path d="M1090,501 L1810,501" stroke="#376861" stroke-width="2" fill="none" /><text id="t10" x="1104" y="559" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Ayrı fiziksel su numunesi</text><path d="M1090,599 L1810,599" stroke="#376861" stroke-width="2" fill="none" /><text id="t11" x="1104" y="657" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Cihaz ve çevresel bağlam</text><path d="M1090,697 L1810,697" stroke="#376861" stroke-width="2" fill="none" /><text id="t12" x="1104" y="755" font-size="38" font-weight="400" fill="#FFFFFF" text-anchor="start">Karşılaştırma / doğrulama</text><path d="M869,582 L1023,582" stroke="#CBEAF0" stroke-width="6" fill="none" /><path d="M1011.9171812132264,588.7949339760986 L1023,582 L1011.9171812132264,575.2050660239014" fill="none" stroke="#CBEAF0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/><text id="t13" x="96" y="930" font-size="43" font-weight="700" fill="#B9EDCA" text-anchor="start">Modeli, sahadan gelen veriyle sınamak ve geliştirmek.</text><path d="M96,986 L1824,986" stroke="#2F625E" stroke-width="2" fill="none" /><text id="t14" x="96" y="1028" font-size="22" font-weight="400" fill="#A2C8C1" text-anchor="start">Saha gözlemi yalnız bilimsel olarak desteklediği girdiyi günceller; kararın değişmesi zorunlu değildir.</text><text id="t15" x="1824" y="1030" font-size="27" font-weight="700" fill="#B9EDCA" text-anchor="end">11</text></g></svg>