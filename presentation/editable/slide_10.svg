<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F3F5EF" stroke="none"/><rect x="96" y="61" width="46" height="5" rx="0" fill="#238567" stroke="none"/><text id="t0" x="96" y="112" font-size="24" font-weight="700" fill="#238567" text-anchor="start">AGROHYDRO</text><text id="t1" x="1824" y="112" font-size="22" font-weight="400" fill="#607774" text-anchor="end">KOŞULLU KARAR · GERÇEK MOTOR</text><text id="t2" x="96" y="219" font-size="58" font-weight="700" fill="#133F3D" text-anchor="start">Örnek gelecek senaryosu</text><path d="M96,267 L1824,267" stroke="#CFDBD4" stroke-width="2" fill="none" /><text id="t3" x="96" y="328" font-size="37" font-weight="700" fill="#133F3D" text-anchor="start">2051 · SSP2–4.5 · Longyearbyen · 100 m²</text><text id="t4" x="96" y="380" font-size="29" font-weight="400" fill="#607774" text-anchor="start">Dengeli plan · Taze ürün çıktısı · Seçilen depo: 10 m³</text><rect x="96" y="425" width="810" height="461" rx="16" fill="#083C3C" stroke="none"/><text id="t5" x="136" y="483" font-size="25" font-weight="700" fill="#CBEAF0" text-anchor="start">SU YÖNETİMİ</text><text id="t6" x="133" y="593" font-size="79" font-weight="700" fill="#CBEAF0" text-anchor="start">14,2 m³/yıl</text><text id="t7" x="138" y="639" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start">Üretime dışarıdan gereken yeni su</text><path d="M136,675 L866,675" stroke="#376861" stroke-width="2" fill="none" /><text id="t8" x="138" y="719" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start">Aylık planda yağış / kar deposundan</text><text id="t9" x="138" y="762" font-size="29" font-weight="400" fill="#FFFFFF" text-anchor="start">Arıtılmış deniz suyu: 0 m³</text><text id="t10" x="138" y="817" font-size="30" font-weight="700" fill="#B9EDCA" text-anchor="start">Mayıs: 1,2 m³ yedek su kontrolü</text><text id="t11" x="138" y="858" font-size="25" font-weight="400" fill="#B7D5CC" text-anchor="start">Günlük hesap; boş depo başlangıcı etkisi var.</text><text id="t12" x="967" y="465" font-size="25" font-weight="700" fill="#238567" text-anchor="start">ÖNERİLEN ÜRETİM · ALAN PAYI</text><rect x="967" y="489" width="632.4999999999999" height="37" rx="0" fill="#238567" stroke="none"/><rect x="1601.5" y="489" width="40.3" height="37" rx="0" fill="#57A582" stroke="none"/><rect x="1643.7999999999997" y="489" width="40.3" height="37" rx="0" fill="#73B3A0" stroke="none"/><rect x="1686.1" y="489" width="40.3" height="37" rx="0" fill="#8BBA8D" stroke="none"/><rect x="1728.3999999999996" y="489" width="40.3" height="37" rx="0" fill="#CAB56F" stroke="none"/><rect x="1770.6999999999998" y="489" width="40.3" height="37" rx="0" fill="#739B95" stroke="none"/><text id="t13" x="967" y="581" font-size="44" font-weight="700" fill="#238567" text-anchor="start">Alabaş %75</text><text id="t14" x="967" y="629" font-size="27" font-weight="400" fill="#607774" text-anchor="start">Roka, fesleğen, marul, turp, pazı: %5’er</text><text id="t15" x="967" y="662.48" font-size="27" font-weight="400" fill="#607774" text-anchor="start">Ürün başına asgari %5, açık çeşitlilik kuralı</text><text id="t16" x="967" y="739" font-size="35" font-weight="700" fill="#133F3D" text-anchor="start">Hidroponik %94,6 · Sera %5,4</text><text id="t17" x="967" y="801" font-size="34" font-weight="700" fill="#133F3D" text-anchor="start">4.204 kg/yıl modellenmiş hasat</text><text id="t18" x="967" y="852" font-size="32" font-weight="700" fill="#8F6723" text-anchor="start">119,2 MWh/yıl elektrik eşdeğeri</text><text id="t19" x="967" y="895" font-size="25" font-weight="400" fill="#607774" text-anchor="start">Bu senaryoda enerji üst sınırı tanımlı değil.</text><text id="t20" x="96" y="947" font-size="29" font-weight="400" fill="#607774" text-anchor="start">Seçilen koşulların sonucu; yerel su erişimi ve üretim performansı sahada sınanmalı.</text><path d="M96,986 L1824,986" stroke="#CFDBD4" stroke-width="2" fill="none" /><text id="t21" x="96" y="1028" font-size="22" font-weight="400" fill="#607774" text-anchor="start">28 Eylül 2026 · Mevcut motorun yeniden hesaplanan çıktısı · Yerel tesis, ölçülmüş hasat veya hava tahmini değildir.</text><text id="t22" x="1824" y="1030" font-size="27" font-weight="700" fill="#238567" text-anchor="end">10</text></g></svg>